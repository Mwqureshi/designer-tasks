<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designer Task Manager — Login</title>
<style>
  :root {
    --ink: #1c1f26;
    --paper: #f5f3ef;
    --card: #ffffff;
    --line: #e3ddd0;
    --accent: #3f6b8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .box {
    width: 100%;
    max-width: 340px;
    padding: 28px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 16px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; font-size: 0.85rem; color: #6b6f78; }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #6b6f78; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fdfcf9;
    color: var(--ink);
    margin-bottom: 14px;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .errors {
    background: #fbeaea;
    border: 1px solid #eeb9b9;
    color: #8a2c2c;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Designer Task Manager</h1>
    <p class="sub">Login karo</p>
    {% if form.errors %}
      <div class="errors">Username ya password ghalat hai.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
